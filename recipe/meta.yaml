{% set name = "inertia-django" %}
{% set version = "2.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/inertia_django-{{ version }}.tar.gz
  sha256: 89ab1ea1a1f45c3441010ecb3d0bca0b0256404d1b1f84e1f1abd734e21006f5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core >=1.0.0
    - pip
  run:
    - python >={{ python_min }},<4.0.0
    - django >=5.2
    - requests >=2

test:
  imports:
    - inertia
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/inertiajs/inertia-django
  summary: Django adapter for the InertiaJS framework
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
