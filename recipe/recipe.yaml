schema_version: 1

context:
  version: 2.0.0

package:
  name: inertia-django
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/i/inertia-django/inertia_django-${{ version }}.tar.gz
  sha256: 89ab1ea1a1f45c3441010ecb3d0bca0b0256404d1b1f84e1f1abd734e21006f5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.12.5,<0.13
    - pip
  run:
    - python >=${{ python_min }},<4.0.0
    - django >=5.2
    # - requests >=2 # extra == "ssr"

tests:
  - python:
      imports:
        - inertia
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Django adapter for the InertiaJS framework
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/inertiajs/inertia-django

extra:
  recipe-maintainers:
    - rxm7706
